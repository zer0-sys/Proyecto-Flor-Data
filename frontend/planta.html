<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalles de Planta - Flor Data</title>
    <style>
        /* --- Reset --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            scroll-behavior: smooth;
            /* ¡CAMBIO! 
            Este es el color verde de fondo de tu maqueta original 
            */
            background-color: #a3b899; 
            color: #333;
        }

        /* --- Barra de navegación (Tus estilos originales) --- */
        header {
            background: #2c2c2c;
            padding: 10px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-bar {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-bar img {
            height: 50px;
        }

        .logo-bar span {
            font-size: 20px;
            font-weight: bold;
            color: white;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #6bbf59;
        }

        .social img {
            height: 28px;
        }

        /* ¡CAMBIO! 
        Estilos del contenedor principal para coincidir con la maqueta 
        */
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 25px;
            /* Color de fondo del contenedor */
            background: #e0e6d9; 
            border-radius: 15px;
            /* Borde morado que señalaste en la maqueta */
            border: 3px solid #9078E8; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* ¡CAMBIO! 
        Estilos para la imagen de la planta 
        */
        .plant-detail img {
            max-width: 500px; /* Tamaño máximo */
            width: 100%; /* Responsiva */
            height: auto;
            border-radius: 15px; /* Bordes redondeados */
            margin: 0 auto 20px auto; /* Centrada */
            display: block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* ¡NUEVO! 
        Estilos para las secciones de la Base de Datos 
        */
        .plant-detail h4 {
            color: #2c522f; /* Verde oscuro para títulos de sección */
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 1.2em;
            text-align: left; /* Alineado a la izquierda */
        }
        
        .plant-detail p, .plant-detail h2 {
            color: #333;
            line-height: 1.6;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: left; /* Alineado a la izquierda */
            font-size: 1em; /* Tamaño de texto normal */
        }

        .plant-detail h2 {
            /* Estilo específico para el nombre científico */
            font-style: italic;
            font-weight: normal;
            font-size: 1.1em;
        }

        .plant-detail hr {
            /* Línea divisora */
            border: 0;
            height: 1px;
            background-color: #c4cbbA; 
            margin: 20px 0;
        }
        /* --- Fin de nuevos estilos de sección --- */


        /* ¡CAMBIO! 
        Estilo del botón "Volver" para que sea redondo como en la maqueta 
        */
        .back-btn {
            display: inline-block;
            background-color: #f0f0f0; /* Color del botón en la maqueta */
            color: #333;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            width: 50px;
            height: 50px;
            line-height: 50px; /* Centra la flecha verticalmente */
            text-align: center;
            border-radius: 50%; /* Lo hace circular */
            margin-bottom: 10px; /* Espacio antes del contenedor */
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.3s;
        }

        .back-btn:hover {
            background: #ddd;
        }

        /* Tus estilos de Carga y Error (sin cambios) */
        .loading {
            text-align: center;
            font-size: 1.5em;
            margin-top: 50px;
        }

        .error {
            text-align: center;
            color: red;
            font-size: 1.5em;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-bar">
            <img src="logo-unach.png" alt="UNACH">
            <span>Flor Data</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html#inicio">INICIO</a></li>
                <li><a href="biblioteca.html#inicio">BIBLIOTECA DIGITAL</a></li>
                <li><a href="ia-chat.html#inicio">IA</a></li>
                <li><a href="#">APLICACIÓN</a></li>
            </ul>
        </nav>
        <div class="social">
            <a href="#"><img src="facebook.png" alt="Facebook"></a>
        </div>
    </header>

    <div class="container">
        
        <a href="biblioteca.html" class="back-btn">&#x21A9;</a>
        
        <div id="plant-detail" class="plant-detail">
            <div class="loading">Cargando...</div>
        </div>

    </div>

    <script>
        // Obtener ID de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const plantId = urlParams.get('id');

        if (!plantId) {
            document.getElementById('plant-detail').innerHTML = '<div class="error">ID de planta no especificado</div>';
        } else {
            // Cargar detalles de la planta
            fetch(`/api/plantas/${plantId}`)
                .then(res => {
                    if (!res.ok) throw new Error('Planta no encontrada');
                    return res.json();
                })
                .then(planta => {

                    /* ¡CAMBIO IMPORTANTE!
                    Aquí rellenamos el HTML con las secciones
                    que pediste (Nombre, Descripción, etc.)
                    Asegúrate que tu base de datos envíe "curiosidades"
                    */
                    document.getElementById('plant-detail').innerHTML = `
                        <img src="${planta.imagen || 'placeholder.jpg'}" alt="${planta.nombreComun}">
                        
                        <h4>Nombre Común:</h4>
                        <p>${planta.nombreComun}</p>
                        
                        <hr>
                        
                        <h4>Nombre Científico:</h4>
                        <h2>${planta.nombreCientifico}</h2>
                        
                        <hr>
                        
                        <h4>Descripción:</h4>
                        <p>${planta.descripcion}</p>
                        
                        <hr>
                        
                        <h4>Curiosidades:</h4>
                        <p>${planta.curiosidades || 'No hay curiosidades disponibles.'}</p>
                    `;
                })
                .catch(err => {
                    console.error('Error cargando planta:', err);
                    document.getElementById('plant-detail').innerHTML = '<div class="error">Error al cargar la información de la planta.</div>';
                });
        }
    </script>
</body>
</html>

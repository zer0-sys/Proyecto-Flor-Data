<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalles de Planta - Flor Data</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            scroll-behavior: smooth;
            background-color: #ebe8e3;
            color: #333;
        }

        /* Barra de navegación */
        header {
            background: #2c2c2c;
            padding: 10px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-bar {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-bar img {
            height: 50px;
        }

        .logo-bar span {
            font-size: 20px;
            font-weight: bold;
            color: white;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #6bbf59;
        }

        .social img {
            height: 28px;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .plant-detail {
            text-align: center;
        }

        .plant-detail img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 20px 0;
        }

        .plant-detail h1 {
            font-size: 2.5em;
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .plant-detail h2 {
            font-size: 1.5em;
            color: #666;
            margin-bottom: 20px;
        }

        .plant-detail p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .back-btn {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            transition: background 0.3s ease;
        }

        .back-btn:hover {
            background: #45a049;
        }

        .loading {
            text-align: center;
            font-size: 1.5em;
            margin-top: 50px;
        }

        .error {
            text-align: center;
            color: red;
            font-size: 1.5em;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-bar">
            <img src="logo-unach.png" alt="UNACH">
            <span>Flor Data</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html#inicio">INICIO</a></li>
                <li><a href="biblioteca.html#inicio">BIBLIOTECA DIGITAL</a></li>
                <li><a href="ia-chat.html#inicio">IA</a></li>
                <li><a href="#">APLICACIÓN</a></li>
            </ul>
        </nav>
        <div class="social">
            <a href="#"><img src="facebook.png" alt="Facebook"></a>
        </div>
        <div>
            <a class="download-btn" href="/downloads/Proyecto-Flor-Data.apk" download>Descargar App</a>
        </div>
    </header>

    <div class="container">
        <div id="plant-detail" class="plant-detail">
            <div class="loading">Cargando...</div>
        </div>
        <a href="biblioteca.html" class="back-btn">Volver a Biblioteca</a>
    </div>

    <script>
        // Obtener ID de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const plantId = urlParams.get('id');

        if (!plantId) {
            document.getElementById('plant-detail').innerHTML = '<div class="error">ID de planta no especificado</div>';
        } else {
            // Cargar detalles de la planta
            fetch(`/api/plantas/${plantId}`)
                .then(res => {
                    if (!res.ok) throw new Error('Planta no encontrada');
                    return res.json();
                })
                .then(planta => {
                    document.getElementById('plant-detail').innerHTML = `
                        <img src="${planta.imagen || 'placeholder.jpg'}" alt="${planta.nombreComun}">
                        <h1>${planta.nombreComun}</h1>
                        <h2>${planta.nombreCientifico}</h2>
                        <p>${planta.descripcion}</p>
                    `;
                })
                .catch(err => {
                    console.error('Error cargando planta:', err);
                    document.getElementById('plant-detail').innerHTML = '<div class="error">Error cargando la planta</div>';
                });
        }
    </script>
</body>
</html>

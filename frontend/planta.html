<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalles de Planta - Flor Data</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #ebe8e3;
            color: #333;
        }

        header {
            background: #4caf50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .plant-detail {
            text-align: center;
        }

        .plant-detail img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 20px 0;
        }

        .plant-detail h1 {
            font-size: 2.5em;
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .plant-detail h2 {
            font-size: 1.5em;
            color: #666;
            margin-bottom: 20px;
        }

        .plant-detail p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .back-btn {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }

        .back-btn:hover {
            background: #45a049;
        }

        .loading {
            text-align: center;
            font-size: 1.5em;
            margin-top: 50px;
        }

        .error {
            text-align: center;
            color: red;
            font-size: 1.5em;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Flor Data - Detalles de Planta</h1>
    </header>

    <div class="container">
        <div id="plant-detail" class="plant-detail">
            <div class="loading">Cargando...</div>
        </div>
        <a href="biblioteca.html" class="back-btn">Volver a Biblioteca</a>
    </div>

    <script>
        // Obtener ID de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const plantId = urlParams.get('id');

        if (!plantId) {
            document.getElementById('plant-detail').innerHTML = '<div class="error">ID de planta no especificado</div>';
        } else {
            // Cargar detalles de la planta
            fetch(`/api/plantas/${plantId}`)
                .then(res => {
                    if (!res.ok) throw new Error('Planta no encontrada');
                    return res.json();
                })
                .then(planta => {
                    document.getElementById('plant-detail').innerHTML = `
                        <img src="${planta.imagen || 'placeholder.jpg'}" alt="${planta.nombreComun}">
                        <h1>${planta.nombreComun}</h1>
                        <h2>${planta.nombreCientifico}</h2>
                        <p>${planta.descripcion}</p>
                    `;
                })
                .catch(err => {
                    console.error('Error cargando planta:', err);
                    document.getElementById('plant-detail').innerHTML = '<div class="error">Error cargando la planta</div>';
                });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flor Data - Biblioteca Digital</title>

    <style>
        /* Reset y Estilos Generales */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body,
        html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            scroll-behavior: smooth;
            background-color: #ebe8e3;
        }

        /* ____________________________________ */
        /* ESTILOS DE LA BARRA DE NAVEGACIÓN (COPIADOS DE INDEX.HTML) */
        /* ____________________________________ */
        header {
            background: #2c2c2c;
            padding: 10px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-bar {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-bar img {
            height: 50px;
            /* ✅ CRÍTICO: Limita el logo de UNACH */
        }

        .logo-bar span {
            font-size: 20px;
            font-weight: bold;
            color: white;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #6bbf59;
        }

        /* Botón de descarga de la app */
        .download-btn {
            background: #539037;
            color: rgb(118, 243, 118);
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-left: 12px;
            transition: background 0.2s ease;
        }

        .download-btn:hover {
            background: #ffffff;
        }

        .social img {
            height: 28px;
            /* ✅ CRÍTICO: Limita el icono de Facebook */
            width: 45px;
        }
        /* Evitar efecto "presionado" o resaltado en móviles/pendientes
           - -webkit-tap-highlight-color quita el resaltado al tocar
           - anular transform/opacity en :active/:focus evita que parezca apachurrado
        */
        .social a {
            display: inline-block;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .social a img {
            transition: transform 120ms ease, opacity 120ms ease;
            transform: none;
            opacity: 1;
            will-change: transform, opacity;
        }

        .social a:active img,
        .social a:focus img,
        .social a:focus-visible img {
            transform: none !important;
            opacity: 1 !important;
            box-shadow: none !important;
        }

        /* ____________________________________ */
        /* ESTILOS ESPECÍFICOS DE LA BIBLIOTECA */
        /* ____________________________________ */

        .content-library {
            background-color: #ebe8e3;
            min-height: calc(100vh - 70px);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .search-container {
            width: 100%;
            max-width: 700px;
            margin-bottom: 40px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 25px;
            background-color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
        }

        .search-icon {
            font-size: 24px;
            color: #333;
            margin-right: 15px;
        }

        .search-container input {
            border: none;
            outline: none;
            flex-grow: 1;
            font-size: 18px;
            padding: 5px 0;
        }

        #plant-list {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .plant-card {
            display: flex;
            background-color: #d8e4d8;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .plant-card:hover {
            transform: translateY(-5px);
        }

        .card-image {
            width: 30%;
            min-width: 150px;
            height: 150px;
            background-color: #9db59d;
            overflow: hidden;
            border-radius: 15px 0 0 15px;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            flex-grow: 1;
            padding: 15px 20px;
        }

        .card-info h3 {
            font-size: 1.4em;
            color: #2e7d32;
            margin-bottom: 5px;
        }

        .card-info p {
            font-size: 1em;
            color: #333;
        }
        /* =========================
           Reglas responsivas para móviles
           ========================= */
        @media (max-width: 900px) {
            header {
                padding: 8px 16px;
                align-items: center;
                /* en móvil organizamos en columna para parecer al inicio */
                flex-direction: column;
                gap: 8px;
                position: relative;
            }

            .logo-bar img {
                height: 42px;
            }

            nav ul {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }

            /* mantener el icono social separado y arriba a la derecha */
            .social {
                position: absolute;
                right: 12px;
                top: 10px;
            }

            .logo-bar {
                justify-content: center;
                gap: 10px;
            }

            nav ul li a {
                font-size: 14px;
            }

            .download-btn {
                padding: 6px 14px;
                font-size: 14px;
                border-radius: 20px;
                /* centrar la pastilla y separarla un poco */
                margin: 6px 0;
            }

            .search-container {
                padding: 8px 14px;
                border-radius: 22px;
                margin: 0 12px 20px 12px;
            }

            .search-container input {
                font-size: 16px;
            }

            #plant-list {
                max-width: 100%;
                padding: 0 12px 30px 12px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .plant-card {
                flex-direction: column;
                align-items: stretch;
                width: 92%;
                max-width: 720px;
            }

            .card-image {
                width: 100%;
                min-width: 0;
                height: 220px;
                border-radius: 15px 15px 0 0;
                overflow: hidden;
            }

            .card-image img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .card-info {
                padding: 14px;
            }

            .card-info h3 {
                font-size: 1.4em;
            }

            .card-info p {
                font-size: 0.95em;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 8px 12px;
            }

            .logo-bar img { height: 36px; }
            .logo-bar span { font-size: 18px; }

            nav ul { gap: 8px; }
            nav ul li a { font-size: 13px; }

            .search-container { padding: 8px 12px; }

            .card-image { height: 160px; }

            .download-btn { font-size: 13px; padding: 6px 8px; }
        }
    </style>
</head>

<body>

<!-- Modal del Ranking -->
<div id="modalRanking" style="display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.7);">
    <div style="background-color:#f8f9fa; margin: 10% auto; padding: 20px; border-radius: 12px; width: 90%; max-width: 450px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative;">
        <span onclick="cerrarModalRanking()" style="position: absolute; right: 15px; top: 10px; font-size: 24px; font-weight: bold; cursor: pointer; color: #555;">&times;</span>
        <h2 style="text-align: center; color: #1b5e20; margin-top: 0;">🏆 Tabla de Clasificación</h2>
        
        <div id="contenidoRanking" style="margin-top: 15px; max-height: 350px; overflow-y: auto;">
            <p style="text-align: center; color: #666;">Cargando posiciones...</p>
        </div>
    </div>
</div>

    <header>
        <div class="logo-bar">
            <img src="logo-unach.png" alt="UNACH">
            <span>Flor Data</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html?skip_splash=true#inicio">INICIO</a></li>

                <li><a href="biblioteca.html#inicio">BIBLIOTECA DIGITAL</a></li>
                <a href="#" onclick="abrirModalRanking()" style="text-decoration: none; color: white; font-weight: bold; margin-left: 20px;">RANKING 🏆</a>
                <li><a href="ia-chat.html#inicio">IA</a></li>
                <button onclick="cambiarApiKey()" style="background: #ff9800; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;">
    🔄 Renovar API Key
</button>
                <li><a class="download-btn" href="/downloads/Proyecto-Flor-Data.apk" download>APLICACIÓN</a></li>
            </ul>
        </nav>
        <div class="social">
            <a href="https://www.facebook.com/profile.php?id=100057134842799" target="_blank" rel="noopener noreferrer">
                <img src="facebook.png" alt="Facebook">
            </a>
        </div>
        
    </header>

    <div class="content-library">
        <div class="search-container">
            <span class="search-icon">&#x1F50D;</span>
            <input type="text" placeholder="Buscar por nombre o especie científica...">
        </div>

        <div id="plant-list">
            <!-- Las plantas se cargarán dinámicamente desde la API -->
        </div>
    </div>
    <!-- ====== MODAL BONITO PARA CAMBIAR API KEY ====== -->
<div id="modalCambiarKey" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center;">
    <div style="background: white; padding: 30px 25px; border-radius: 15px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
        
        <h2 style="color: #2e7d32; margin-top: 0; margin-bottom: 10px; font-size: 24px;">¡Renovar Llave! 🌿</h2>
        
        <p style="color: #555; font-size: 15px; margin-bottom: 20px; line-height: 1.4;">
            Tus créditos se agotaron. Genera una nueva <b>API Key</b> en Plant.id y pégala aquí abajo para seguir escaneando.
        </p>
        
        <input type="text" id="nuevaKeyInput" placeholder="Pega tu nueva API Key aquí..." style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; outline: none;">
        
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button onclick="cerrarModalKey()" style="background: #e0e0e0; color: #333; border: none; padding: 12px 15px; border-radius: 8px; cursor: pointer; flex: 1; font-weight: bold; font-size: 15px;">Cancelar</button>
            
            <button onclick="guardarNuevaKey()" style="background: #31786d; color: white; border: none; padding: 12px 15px; border-radius: 8px; cursor: pointer; flex: 1; font-weight: bold; font-size: 15px;">Guardar</button>
        </div>
    </div>
</div>

    <script>

    const plantList = document.getElementById('plant-list');
    const searchInput = document.querySelector('.search-container input');

    // Función para renderizar plantas
    function renderPlantas(plantas) {
        plantList.innerHTML = '';
        plantas.forEach(planta => {
            const card = document.createElement('div');
            card.className = 'plant-card';
            card.innerHTML = `
                <div class="card-image">
                    <img src="${planta.imagen || 'placeholder.jpg'}" alt="${planta.nombreComun}">
                </div>
                <div class="card-info">
                    <h3>${planta.nombreComun || planta.nombrecomun}</h3>
                    <p><em>${planta.nombreCientifico || planta.nombrecientifico}</em></p>
                    <p>${planta.descripcion}</p>
                </div>
            `;
            // Al dar clic, manda a planta.html con el ID correspondiente
            card.onclick = () => window.location.href = `planta.html?id=${planta.id}`;
            plantList.appendChild(card);
        });
    }

    // Cargar todas las plantas al inicio
    fetch('/api/plantas')
        .then(res => res.json())
        .then(renderPlantas)
        .catch(err => console.error('Error cargando plantas:', err));

    // Búsqueda en tiempo real
    searchInput.addEventListener('input', () => {
        const query = searchInput.value.trim();
        const url = query ? `/api/plantas/search?q=${encodeURIComponent(query)}` : '/api/plantas';
        fetch(url)
            .then(res => res.json())
            .then(renderPlantas);
    });
    // 1. Abre la ventana bonita
function cambiarApiKey() {
    const modal = document.getElementById('modalCambiarKey');
    const input = document.getElementById('nuevaKeyInput');
    
    input.value = ''; // Limpiamos el texto por si había algo escrito antes
    modal.style.display = 'flex'; // Mostramos el modal
}

// 2. Cierra la ventana si el usuario se arrepiente
function cerrarModalKey() {
    document.getElementById('modalCambiarKey').style.display = 'none';
}

// 3. Guarda la llave nueva cuando le dan al botón verde
function guardarNuevaKey() {
    const nuevaLlave = document.getElementById('nuevaKeyInput').value.trim();
    
    if (nuevaLlave !== "") {
        localStorage.setItem('miPlantIdKey', nuevaLlave);
        cerrarModalKey(); // Escondemos el modal
        
        // Un pequeño aviso discreto (opcional, puedes borrar esta línea si no lo quieres)
        alert("¡Listo! Tu nueva llave ha sido guardada. Intenta escanear tu planta de nuevo.");
    } else {
        alert("Por favor, ingresa una llave válida.");
    }
}

async function abrirModalRanking() {
    document.getElementById('modalRanking').style.display = 'block';
    const contenedor = document.getElementById('contenidoRanking');
    contenedor.innerHTML = '<p style="text-align: center; color: #666;">Cargando posiciones...</p>';
    
    try {
        const response = await fetch('/api/ranking');
        const datos = await response.json();
        
        if (datos.length === 0) {
            contenedor.innerHTML = '<p style="text-align: center; color: #666;">Aún no hay misiones completadas. ¡Sé el primer equipo en registrar puntos!</p>';
            return;
        }
        
        let tablaHTML = '<table style="width:100%; border-collapse: collapse; text-align: left;">';
        tablaHTML += '<tr style="background-color: #c8e6c9; border-bottom: 2px solid #81c784;"> <th style="padding: 10px;">Pos</th> <th style="padding: 10px;">Equipo</th> <th style="padding: 10px; text-align: center;">Puntos</th> </tr>';
        
        datos.forEach((fila, index) => {
            let medalla = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : (index + 1);
            let fondoFila = index % 2 === 0 ? '#ffffff' : '#f1f8e9';
            
            tablaHTML += `<tr style="background-color: ${fondoFila}; border-bottom: 1px solid #e0e0e0;">
                <td style="padding: 10px; font-weight: bold; font-size: 1.1em;">${medalla}</td>
                <td style="padding: 10px; font-weight: bold; color: #333;">${fila.nombre_equipo}</td>
                <td style="padding: 10px; text-align: center; font-weight: bold; color: #2e7d32; font-size: 1.1em;">${fila.puntaje}</td>
            </tr>`;
        });
        
        tablaHTML += '</table>';
        contenedor.innerHTML = tablaHTML;
        
    } catch (error) {
        console.error(error);
        contenedor.innerHTML = '<p style="color: #d32f2f; text-align: center;">Error al cargar el ranking. Verifica tu conexión.</p>';
    }
}

function cerrarModalRanking() {
    document.getElementById('modalRanking').style.display = 'none';
}
</script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flor Data - Biblioteca Digital</title>

    <style>
        /* Reset y Estilos Generales */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body,
        html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            scroll-behavior: smooth;
            background-color: #ebe8e3;
        }

        /* ____________________________________ */
        /* ESTILOS DE LA BARRA DE NAVEGACIÓN (COPIADOS DE INDEX.HTML) */
        /* ____________________________________ */
        header {
            background: #2c2c2c;
            padding: 10px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-bar {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-bar img {
            height: 50px;
            /* ✅ CRÍTICO: Limita el logo de UNACH */
        }

        .logo-bar span {
            font-size: 20px;
            font-weight: bold;
            color: white;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #6bbf59;
        }

        /* Botón de descarga de la app */
        .download-btn {
            background: #539037;
            color: rgb(118, 243, 118);
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-left: 12px;
            transition: background 0.2s ease;
        }

        .download-btn:hover {
            background: #ffffff;
        }

        .social img {
            height: 28px;
            /* ✅ CRÍTICO: Limita el icono de Facebook */
            width: 45px;
        }
        /* Evitar efecto "presionado" o resaltado en móviles/pendientes
           - -webkit-tap-highlight-color quita el resaltado al tocar
           - anular transform/opacity en :active/:focus evita que parezca apachurrado
        */
        .social a {
            display: inline-block;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .social a img {
            transition: transform 120ms ease, opacity 120ms ease;
            transform: none;
            opacity: 1;
            will-change: transform, opacity;
        }

        .social a:active img,
        .social a:focus img,
        .social a:focus-visible img {
            transform: none !important;
            opacity: 1 !important;
            box-shadow: none !important;
        }

        /* ____________________________________ */
        /* ESTILOS ESPECÍFICOS DE LA BIBLIOTECA */
        /* ____________________________________ */

        .content-library {
            background-color: #ebe8e3;
            min-height: calc(100vh - 70px);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .search-container {
            width: 100%;
            max-width: 700px;
            margin-bottom: 40px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 25px;
            background-color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
        }

        .search-icon {
            font-size: 24px;
            color: #333;
            margin-right: 15px;
        }

        .search-container input {
            border: none;
            outline: none;
            flex-grow: 1;
            font-size: 18px;
            padding: 5px 0;
        }

        #plant-list {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .plant-card {
            display: flex;
            background-color: #d8e4d8;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .plant-card:hover {
            transform: translateY(-5px);
        }

        .card-image {
            width: 30%;
            min-width: 150px;
            height: 150px;
            background-color: #9db59d;
            overflow: hidden;
            border-radius: 15px 0 0 15px;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            flex-grow: 1;
            padding: 15px 20px;
        }

        .card-info h3 {
            font-size: 1.4em;
            color: #2e7d32;
            margin-bottom: 5px;
        }

        .card-info p {
            font-size: 1em;
            color: #333;
        }
        /* =========================
           Reglas responsivas para móviles
           ========================= */
        @media (max-width: 900px) {
            header {
                padding: 8px 16px;
                align-items: center;
                /* en móvil organizamos en columna para parecer al inicio */
                flex-direction: column;
                gap: 8px;
                position: relative;
            }

            .logo-bar img {
                height: 42px;
            }

            nav ul {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }

            /* mantener el icono social separado y arriba a la derecha */
            .social {
                position: absolute;
                right: 12px;
                top: 10px;
            }

            .logo-bar {
                justify-content: center;
                gap: 10px;
            }

            nav ul li a {
                font-size: 14px;
            }

            .download-btn {
                padding: 6px 14px;
                font-size: 14px;
                border-radius: 20px;
                /* centrar la pastilla y separarla un poco */
                margin: 6px 0;
            }

            .search-container {
                padding: 8px 14px;
                border-radius: 22px;
                margin: 0 12px 20px 12px;
            }

            .search-container input {
                font-size: 16px;
            }

            #plant-list {
                max-width: 100%;
                padding: 0 12px 30px 12px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .plant-card {
                flex-direction: column;
                align-items: stretch;
                width: 92%;
                max-width: 720px;
            }

            .card-image {
                width: 100%;
                min-width: 0;
                height: 220px;
                border-radius: 15px 15px 0 0;
                overflow: hidden;
            }

            .card-image img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .card-info {
                padding: 14px;
            }

            .card-info h3 {
                font-size: 1.4em;
            }

            .card-info p {
                font-size: 0.95em;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 8px 12px;
            }

            .logo-bar img { height: 36px; }
            .logo-bar span { font-size: 18px; }

            nav ul { gap: 8px; }
            nav ul li a { font-size: 13px; }

            .search-container { padding: 8px 12px; }

            .card-image { height: 160px; }

            .download-btn { font-size: 13px; padding: 6px 8px; }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo-bar">
            <img src="logo-unach.png" alt="UNACH">
            <span>Flor Data</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html?skip_splash=true#inicio">INICIO</a></li>

                <li><a href="biblioteca.html#inicio">BIBLIOTECA DIGITAL</a></li>
                <li><a href="ia-chat.html#inicio">IA</a></li>
                <li><a class="download-btn" href="/downloads/Proyecto-Flor-Data.apk" download>APLICACIÓN</a></li>
            </ul>
        </nav>
        <div class="social">
            <a href="https://www.facebook.com/profile.php?id=100057134842799" target="_blank" rel="noopener noreferrer">
                <img src="facebook.png" alt="Facebook">
            </a>
        </div>
        
    </header>

    <div class="content-library">
        <div class="search-container">
            <span class="search-icon">&#x1F50D;</span>
            <input type="text" placeholder="Buscar por nombre o especie científica...">
        </div>

        <div id="plant-list">
            <!-- Las plantas se cargarán dinámicamente desde la API -->
        </div>
    </div>

    <script>
        const plantList = document.getElementById('plant-list');
        const searchInput = document.querySelector('.search-container input');

        // Función para renderizar plantas
        function renderPlantas(plantas) {
            plantList.innerHTML = '';
            plantas.forEach(planta => {
                const card = document.createElement('div');
                card.className = 'plant-card';
                card.innerHTML = `
                    <div class="card-image">
                        <img src="${planta.imagen || 'placeholder.jpg'}" alt="${planta.nombreComun}">
                    </div>
                    <div class="card-info">
                        <h3>${planta.nombreComun}</h3>
                        <p><em>${planta.nombreCientifico}</em></p>
                        <p>${planta.descripcion}</p>
                    </div>
                `;
                card.onclick = () => window.location.href = `planta.html?id=${planta.id}`;
                plantList.appendChild(card);
            });
        }

        // Cargar todas las plantas al inicio
        fetch('/api/plantas')
            .then(res => res.json())
            .then(renderPlantas)
            .catch(err => console.error('Error cargando plantas:', err));

        // Búsqueda en tiempo real
        searchInput.addEventListener('input', () => {
            const query = searchInput.value.trim();
            const url = query ? `/api/plantas/search?q=${encodeURIComponent(query)}` : '/api/plantas';
            fetch(url)
                .then(res => res.json())
                .then(renderPlantas);
        });
    </script>
</body>

</html>
